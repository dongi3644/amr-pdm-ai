<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR 고장 예지 · 로봇 1대 시뮬레이션</title>
<style>
:root{--ink:#1c2630;--muted:#5b6876;--line:#d8dee4;--paper:#fff;--bg:#f3f5f7;--ok:#2e7d32;--warn:#f9a825;--bad:#c62828;--blue:#2a6fdb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px;background:#1c2630;color:#fff}
header h1{font-size:18px;margin:0;font-weight:800}
.tag{font-size:12px;background:#ffcc80;color:#3e2700;border-radius:4px;padding:3px 8px;font-weight:700;margin-left:8px}
.ctrl{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
button.on{background:#fff;color:#1c2630;font-weight:800}
main{padding:14px 20px 24px;display:grid;gap:14px;max-width:1500px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
#band{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-radius:12px;color:#fff}
#verdict{font-size:clamp(26px,3.4vw,42px);font-weight:800;line-height:1.15}
#todo{font-size:17px;margin-top:6px;font-weight:700;opacity:.95}
#clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
#clockSub{font-size:14px;text-align:right;margin-top:4px;opacity:.9}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
#robot{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
#robot rect.tire{transition:fill .25s}
#robot .w-amber rect.tire{fill:#fbc02d;stroke:#a77800;stroke-width:4;stroke-dasharray:8 5}
#robot .w-red rect.tire{fill:#d32f2f;stroke:#8e0000;stroke-width:5;animation:blink 1s infinite}
#robot .w-org rect.tire{fill:#ef6c00;stroke:#a33f00;stroke-width:5;animation:blink 1.4s infinite}
#robot .w-org .wl{fill:#c25400;font-weight:800}
#robot .w-red .wl{fill:#c62828;font-weight:800}#robot .w-amber .wl{fill:#8a6100;font-weight:800}
#robot .bang,#robot .ask{display:none}#robot .w-red .bang,#robot .w-org .bang,#robot .w-amber .ask{display:block}
#robot .w-org .bang circle{fill:#ef6c00}
@keyframes blink{50%{opacity:.45}}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);justify-content:center;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scoreRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#score{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#scoreLv{font-size:20px;font-weight:800}
#gwrap{position:relative;margin-top:12px}
#gauge{height:22px;border-radius:11px;overflow:hidden;display:flex}
#needle{position:absolute;top:-6px;width:6px;height:34px;background:var(--ink);border-radius:3px;transform:translateX(-3px)}
.gscale{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:4px}
.gscale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#checks{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #b0bec5;background:#fff;display:inline-block}
.dot.on{background:#f9a825;border-color:#b26a00}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{border-radius:10px;padding:10px 12px;background:#f6f8fa;border:1px solid var(--line)}
.tile span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.tile b{display:block;font-size:20px;margin-top:4px;line-height:1.25}
.tile.hot{background:#fdecea;border-color:#ef9a9a}.tile.hot b{color:#c62828}
.tile.org{background:#fff3e0;border-color:#ffb74d}.tile.org b{color:#c25400}
.tile.amb{background:#fff8e1;border-color:#ffe082}.tile.amb b{color:#8a6100}
.probs{display:grid;gap:7px;margin-top:14px}
.prob{display:grid;grid-template-columns:120px 1fr 48px;gap:8px;align-items:center;font-size:14px}
.prob .pb{height:12px;background:#e7ebef;border-radius:6px;overflow:hidden}.prob .pb i{display:block;height:100%;border-radius:6px}
.prob b{text-align:right;font-variant-numeric:tabular-nums}
svg.chart{width:100%;display:block;cursor:pointer}
details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 18px}
summary{cursor:pointer;font-weight:700;color:var(--muted)}
.more{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:1000px){.more{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px;margin:8px 0 0}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
.reason{font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
#log{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;font-size:13px}
#log li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
#log .t{color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px}
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">AMR 고장 예지 · 로봇 1대 시뮬레이션</h1></div>
  <div class="ctrl">
    <button id="btnPlay" style="min-width:84px;font-weight:800">⏸ 멈춤</button>
    <button data-sp="1">×1</button><button data-sp="5">×5</button><button data-sp="10" class="on">×10</button><button data-sp="30">×30</button>
    <button id="btnReset" title="처음으로">↺</button>
  </div>
</header>

<main>
  <div id="band">
    <div><div id="verdict">-</div><div id="todo"></div></div>
    <div><div id="clock">0:00</div><div id="clockSub"></div></div>
  </div>

  <div class="g2">
    <div class="card">
      <svg id="robot" viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend"><span><i style="background:#fbc02d"></i>? 확인 중</span><span><i style="background:#ef6c00"></i>! 고장 의심 부위</span><span><i style="background:#d32f2f"></i>! 경고</span><span><i style="background:#455a64"></i>정상</span></div>
    </div>
    <div class="card">
      <h2>AI 건강 점수 (경보 뒤에는 시연용 표시)</h2>
      <div class="scoreRow"><span id="score">0.0</span><span id="scoreLv">정상</span></div>
      <div id="gwrap"><div id="gauge"></div><div id="needle"></div></div>
      <div class="gscale" id="gscale"></div>
      <div id="checks"></div>
      <div class="tiles">
        <div class="tile" id="tWhere"><span>어디</span><b>-</b></div>
        <div class="tile" id="tWhat"><span>무엇</span><b>-</b></div>
        <div class="tile" id="tTodo"><span>할 일</span><b>-</b></div>
      </div>
      <div class="probs" id="probs"></div>
    </div>
  </div>

  <div class="card">
    <h2>점수 변화 · 그래프를 누르면 그 시각으로 이동</h2>
    <svg class="chart" id="chart" viewBox="0 0 1400 250"></svg>
  </div>

  <details>
    <summary>자세히 보기 (센서 · 판단 근거 · 알림 기록 · 정답)</summary>
    <div class="more">
      <div>
        <h2>센서 (최근 3초)</h2>
        <svg class="chart" id="wave" viewBox="0 0 400 110" style="cursor:default"></svg>
        <dl class="kv"><dt>실제 AI 점수</dt><dd id="vReal">-</dd><dt>진동 크기</dt><dd id="vRms">-</dd><dt>전류</dt><dd id="vCur">-</dd><dt>전압</dt><dd id="vVolt">-</dd></dl>
      </div>
      <div><h2 id="reasonTitle">판단 근거</h2><div id="reasons">-</div>
        <h2 style="margin-top:12px">정답 (시뮬레이션이 넣은 고장 · AI는 모름)</h2><div id="truth" style="font-size:14px">-</div></div>
      <div><h2>알림 기록</h2><ul id="log"></ul></div>
    </div>
  </details>
</main>

<script>
const DATA=/*__DATA__*/null;
const M = DATA.meta, F = DATA.frames, N = F.length, END = F[N-1].t;
const COL = ["#2e7d32","#f9a825","#c62828"], TXT = ["#fff","#1c2630","#fff"], STK = ["정상","의심 중","경고"];
const WK = M.wheel_show, KS = M.kind_show, CAU = M.caution, WARN = M.warning, GMAX = 12;
const SHORT_TODO = {unbalance:"바퀴 고정 · 이물질 확인", looseness:"나사 · 브래킷 조이기", bearing:"축 · 베어링 걸림 확인", unknown:"해당 부위 직접 점검"};
const $ = id => document.getElementById(id);
const mmss = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
const line = pts => pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");

const SM = 20, wpS = [], kpS = [];
for(let i=0;i<N;i++){
  const a = Math.max(0,i-SM+1), w = {fl:0,fr:0,rl:0,rr:0}, k = {};
  for(let j=a;j<=i;j++){ for(const x in w) w[x]+=F[j].wp[x]||0; for(const x in F[j].kp) k[x]=(k[x]||0)+F[j].kp[x]; }
  const n = i-a+1; for(const x in w) w[x]/=n; for(const x in k) k[x]/=n; wpS.push(w); kpS.push(k);
}
const SMS = 60, smS = []; { let acc = 0; for(let i=0;i<N;i++){ acc += F[i].ew; if(i>=SMS) acc -= F[i-SMS].ew; smS.push(acc/Math.min(i+1,SMS)); } }
// 시연용 표시 점수: 경보 뒤에는 실제 점수(smS)의 오르내림만 남겨 3.9~4.1 안으로 줄임 (실제 값은 '자세히 보기')
const A0 = F.findIndex(f=>f.st>=1), DISP_C = 4.0, DISP_H = 0.1;
const postS = A0>=0 ? smS.slice(A0) : [], postM = postS.length ? postS.reduce((a,b)=>a+b,0)/postS.length : 0;
const postD = postS.length ? Math.max(1e-6, ...postS.map(v=>Math.abs(v-postM))) : 1;
const toDisp = v => DISP_C + DISP_H * Math.max(-1, Math.min(1, (v-postM)/postD)) * 0.98;
const dispS = smS.map((v,j)=> A0>=0 && j>=A0 ? toDisp(v) : v);
// 원인 확률은 최근 60초 평균 (경보 뒤에만 보여 줌)
const kpL = []; for(let i=0;i<N;i++){ const a = Math.max(0,i-59), k = {}; for(let j=a;j<=i;j++) for(const x in F[j].kp) k[x]=(k[x]||0)+F[j].kp[x]; for(const x in k) k[x]/=(i-a+1); kpL.push(k); }
const base = F.slice(0,5).reduce((s,x)=>s+x.rms,0)/Math.min(5,N);
const firstAlarm = F.findIndex(f=>f.st>=1);
const events = [[0,"정상 주행 시작"],[M.start,`[정답] ${WK[M.wheel]} 바퀴 ${M.kind_ko} 시작 (약하게)`]];
for(let i=1;i<N;i++) if(F[i].st!==F[i-1].st){ const f=F[i]; events.push([f.t,`AI ${STK[f.st]}` + (f.cw?` · ${WK[f.cw]} 바퀴 ${KS[f.ck]||f.ck}`:f.ck==="unknown"?" · 처음 보는 이상":"")]); }

function buildRobot(){
  const W = (id,x,y,lx,ly) => `
    <g id="w_${id}"><rect class="tire" x="${x}" y="${y}" width="50" height="100" rx="12" fill="#455a64" stroke="#263238" stroke-width="2"/>
      ${[20,36,52,68,84].map(d=>`<line x1="${x+7}" x2="${x+43}" y1="${y+d}" y2="${y+d}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`).join("")}
      <text class="wl" x="${lx}" y="${ly}" text-anchor="middle" font-size="17" fill="#37474f" font-weight="700">${WK[id]}</text>
      <g class="bang"><circle cx="${x+50}" cy="${y}" r="17" fill="#d32f2f"/><text x="${x+50}" y="${y+7}" text-anchor="middle" fill="#fff" font-weight="800" font-size="21">!</text></g>
      <g class="ask"><circle cx="${x+50}" cy="${y}" r="17" fill="#fbc02d" stroke="#a77800"/><text x="${x+50}" y="${y+7}" text-anchor="middle" fill="#1c2630" font-weight="800" font-size="21">?</text></g></g>`;
  $("robot").innerHTML = `
    <text x="260" y="24" text-anchor="middle" font-size="15" fill="#78909c" font-weight="700">▲ 앞</text>
    <rect x="120" y="44" width="280" height="320" rx="28" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
    <rect x="200" y="78" width="120" height="44" rx="8" fill="#37474f"/><text x="260" y="106" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">배터리</text>
    <rect x="190" y="160" width="140" height="62" rx="10" fill="#1565c0"/><text x="260" y="197" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">AI 제어기</text>
    <path id="vibRing" d="" fill="#00897b" fill-opacity=".12" stroke="#00897b" stroke-width="2"/>
    <circle cx="260" cy="282" r="20" fill="#00897b"/><text x="260" y="287" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">진동</text>
    ${W("fl",60,66,70,190)}${W("fr",410,66,450,190)}${W("rl",60,250,70,374)}${W("rr",410,250,450,374)}`;
}
function buildGauge(){
  $("gauge").innerHTML = [[0,CAU,"#c8e6c9"],[CAU,WARN,"#ffe082"],[WARN,GMAX,"#ef9a9a"]].map(([a,b,c])=>`<div style="width:${(b-a)/GMAX*100}%;background:${c}"></div>`).join("");
  $("gscale").innerHTML = [[CAU/2,"정상"],[CAU,`${CAU}`],[(CAU+WARN)/2,"의심 중"],[WARN,`${WARN}`],[(WARN+GMAX)/2,"경고"]].map(([v,t])=>`<span style="left:${v/GMAX*100}%;${/\d/.test(t)?"":"font-weight:700;color:#37474f"}">${t}</span>`).join("");
}

let T = 0, playing = true, speed = 10;
function tile(id, text, cls){ const t = $(id); t.className = "tile" + (cls?" "+cls:""); t.querySelector("b").textContent = text; }

function draw(){
  const i = Math.max(0, Math.min(N-1, Math.floor(T))), f = F[i], st = f.st, w = wpS[i];
  const sm = dispS[i], smReal = smS[i], watching = st===0 && sm >= CAU*0.8;
  const topW = Object.keys(w).reduce((a,b)=>w[a]>w[b]?a:b);
  const kind = f.ck==="unknown" ? "처음 보는 이상" : (KS[f.ck]||"");
  $("band").style.background = st===1 ? "#ef6c00" : COL[st]; $("band").style.color = st===1 ? "#fff" : TXT[st];
  $("verdict").textContent = st===0 ? (watching ? "정상 · 이상 징후 확인 중" : "정상") :
    `${STK[st]} · ${f.cw ? `${WK[f.cw]} 바퀴 ${kind}` : kind || "원인 확인 중"}`;
  $("todo").textContent = st>=1 ? "할 일: " + (SHORT_TODO[f.ck] || "점검") : "";
  $("clock").textContent = mmss(T);
  $("clockSub").textContent = T < M.start ? `고장까지 ${Math.ceil(M.start-T)}초` : `고장 시작 +${mmss(T-M.start)}`;
  ["fl","fr","rl","rr"].forEach(k=>{
    const g = $("w_"+k); g.classList.remove("w-red","w-amber");
    if(st>=1 && f.cw===k) g.classList.add(st===2 ? "w-red" : "w-org");
    else if((st>=1 && !f.cw && w[k]>=0.15) || (watching && k===topW && w[k]>=0.35)) g.classList.add("w-amber");
  });
  const rr = 22 + Math.min(42, (f.rms/base-1)*32);
  $("vibRing").setAttribute("d", `M ${260-rr} 282 a ${rr} ${rr} 0 1 0 ${2*rr} 0 a ${rr} ${rr} 0 1 0 ${-2*rr} 0`);
  const lv = st>=1 ? st : (sm>=CAU ? 1 : 0), LC = ["#2e7d32","#c25400","#c62828"];   // 경보 뒤에는 AI 판정과 같은 이름
  $("score").textContent = sm.toFixed(1); $("score").style.color = LC[lv];
  $("scoreLv").textContent = st>=1 ? `AI 판정 ${STK[st]}` : (sm>=CAU ? "올라가는 중" : "정상"); $("scoreLv").style.color = LC[lv];
  $("needle").style.left = Math.min(100, sm/GMAX*100)+"%";
  const done = M.minutes.filter(m=>m.m*60 <= T+1e-6);
  let cnt = 0; for(let j=done.length-1;j>=0;j--){ const l = done[j].s>=WARN?2:done[j].s>=CAU?1:0; if(l>st) cnt++; else break; }
  const dots = Array.from({length:M.confirm},(_,j)=>`<span class="dot${j<cnt?" on":""}"></span>`).join("");
  $("checks").innerHTML = st===2 ? `<b style="color:#c62828">경고 확정</b>` :
    `1분 판정 ${dots} <span>${cnt>0 ? `${M.confirm}번 연속이면 ${STK[st+1]}` : `다음 판정 ${60-(Math.floor(T)%60)}초 뒤`}</span>`;
  if(st>=1){
    const tc = st===2 ? "hot" : "org";
    tile("tWhere", f.cw ? `${WK[f.cw]} 바퀴` : "특정 못 함", tc);
    tile("tWhat", kind || "확인 중", tc);
    tile("tTodo", SHORT_TODO[f.ck] || "점검", tc);
  } else if(watching){
    tile("tWhere", `${WK[topW]} 바퀴?`, "amb"); tile("tWhat", "확인 중", "amb"); tile("tTodo", "지켜보기", "amb");
  } else { tile("tWhere","이상 없음"); tile("tWhat","-"); tile("tTodo","계속 운행"); }
  const kp = kpL[i];
  $("probs").innerHTML = st>=1 ? ["unbalance","looseness","bearing","unknown"].map(k=>[KS[k]||k, kp[k]||0, k===f.ck&&st>=1])
    .sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,v,hot])=>`<div class="prob"><span>${n}</span><div class="pb"><i style="width:${(v*100).toFixed(0)}%;background:${hot?(st===2?"#c62828":"#ef6c00"):"#90a4ae"}"></i></div><b>${(v*100).toFixed(0)}%</b></div>`).join("")
    : "";

  const CW = 1400, X = t => 46 + t/END*(CW-60), Y = v => 180 - Math.min(v,GMAX)/GMAX*165;
  let g = "";
  [[0,CAU,"#e8f5e9"],[CAU,WARN,"#fff8e1"],[WARN,GMAX,"#fdecea"]].forEach(([a,b,c])=>{ g += `<rect x="46" y="${Y(b)}" width="${CW-60}" height="${Y(a)-Y(b)}" fill="${c}"/>`; });
  [[CAU,"의심"],[WARN,"경고"]].forEach(([v,t])=>{ g += `<line x1="46" x2="${CW-14}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===CAU?"#e0a800":"#c62828"}" stroke-dasharray="5 4"/><text x="40" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="${v===CAU?"#b26a00":"#c62828"}" font-weight="700">${t}</text>`; });
  for(let m=0;m<=Math.floor(END/60);m+=1) g += `<text x="${X(m*60)}" y="244" text-anchor="middle" font-size="12" fill="#5b6876">${m}분</text>`;
  g += `<polyline fill="none" stroke="#2a6fdb" stroke-width="3" points="${line(F.slice(0,i+1).map((x,j)=>[X(x.t), Y(dispS[j])]))}"/>`;
  done.forEach(m=>{ const l = m.s>=WARN?2:m.s>=CAU?1:0; const yv = (A0>=0 && m.m*60 > F[A0].t) ? toDisp(m.s) : m.s; g += `<line x1="${X(m.m*60-58)}" x2="${X(m.m*60-2)}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="${COL[l]}" stroke-width="6" stroke-linecap="round"/>`; });
  const Ys = v => 226 - v*30, sp = F.map(x=>[X(x.t), Ys(x.sev)]);
  g += `<text x="40" y="218" text-anchor="end" font-size="11" fill="#bf360c">정답</text><polygon fill="#eceff1" points="${X(0)},226 ${line(sp)} ${X(END)},226"/><polygon fill="#ffab91" points="${X(0)},226 ${line(sp.slice(0,i+1))} ${X(f.t)},226"/>`;
  g += `<line x1="${X(M.start)}" x2="${X(M.start)}" y1="16" y2="226" stroke="#bf360c" stroke-dasharray="2 3"/><text x="${X(M.start)+4}" y="12" font-size="12" fill="#bf360c" font-weight="700">▼ 고장 시작</text>`;
  if(firstAlarm>=0) g += `<text x="${X(F[firstAlarm].t)}" y="12" text-anchor="middle" font-size="12" fill="#b26a00" font-weight="700">★ AI 경보</text>`;
  g += `<line x1="${X(T)}" x2="${X(T)}" y1="16" y2="226" stroke="#1c2630" stroke-width="2"/>`;
  $("chart").innerHTML = g;

  const a0 = Math.max(0,i-2), seg = F.slice(a0,i+1), zs = [].concat(...seg.map(x=>x.wav[1])), xs = [].concat(...seg.map(x=>x.wav[0]));
  const amp = Math.max(0.25, ...zs.map(Math.abs), ...xs.map(Math.abs)), P = arr => arr.map((v,j)=>[j/Math.max(1,arr.length-1)*400, 55 - v/amp*48]);
  $("wave").innerHTML = `<line x1="0" x2="400" y1="55" y2="55" stroke="#e7ebef"/><polyline fill="none" stroke="#90a4ae" stroke-width="1.2" points="${line(P(xs))}"/><polyline fill="none" stroke="#2a6fdb" stroke-width="1.6" points="${line(P(zs))}"/>`;
  $("vReal").textContent = `${smReal.toFixed(1)}점 (최근 1분 평균, 화면 큰 숫자는 경보 뒤 시연용)`;
  $("vRms").textContent = `평소의 ${(f.rms/base).toFixed(1)}배`;
  $("vCur").textContent = isFinite(f.cur) ? f.cur.toFixed(2)+" A" : "-";
  $("vVolt").textContent = isFinite(f.volt) ? f.volt.toFixed(2)+" V" : "-";
  const rs = st>=1 && f.reason.length ? f.reason.map(r=>r[0]) : (f.top||[]).map(([n,z])=>`${n} (평소보다 ${Math.abs(z).toFixed(1)}σ)`);
  $("reasonTitle").textContent = st>=1 ? "판단 근거 (SHAP)" : "평소와 가장 다른 값";
  $("reasons").innerHTML = rs.map(r=>`<div class="reason">${r}</div>`).join("") || "-";
  $("truth").textContent = T < M.start ? `${mmss(M.start)}에 ${WK[M.wheel]} 바퀴 ${M.kind_ko} 시작 예정` : `${WK[M.wheel]} 바퀴 ${M.kind_ko} · 고장 정도 ${f.sev.toFixed(2)}`;
  $("log").innerHTML = events.filter(e=>e[0]<=T).reverse().map(([t,x])=>`<li><span class="t">${mmss(t)}</span><span>${x}</span></li>`).join("");
}

let last = performance.now();
function tick(now){ const dt = (now-last)/1000; last = now;
  if(playing){ T += dt*speed; if(T>=END){ T = END; playing = false; $("btnPlay").textContent = "▶ 다시"; } draw(); }
  requestAnimationFrame(tick); }
$("btnPlay").onclick = ()=>{ if(T>=END) T = 0; playing = !playing; $("btnPlay").textContent = playing ? "⏸ 멈춤" : "▶ 재생"; draw(); };
$("btnReset").onclick = ()=>{ T = 0; playing = true; $("btnPlay").textContent = "⏸ 멈춤"; draw(); };
document.querySelectorAll("[data-sp]").forEach(b=>b.onclick = ()=>{ speed = +b.dataset.sp; document.querySelectorAll("[data-sp]").forEach(x=>x.classList.toggle("on", x===b)); });
$("chart").addEventListener("click", e=>{ const r = $("chart").getBoundingClientRect(); const x = (e.clientX-r.left)/r.width*1400; T = Math.max(0, Math.min(END, (x-46)/1340*END)); draw(); });
buildRobot(); buildGauge(); draw(); requestAnimationFrame(tick);
</script>
</body>
</html>
